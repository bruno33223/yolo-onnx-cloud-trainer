<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLO ONNX Cloud Trainer | Zero-Python Local Training (AGPL-3.0)</title>
  <meta name="description" content="Train YOLO computer vision models directly in the cloud (GitHub Actions / Google Colab) with zero local Python requirement and a strict Zero-Data Retention policy.">

  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='m4.93 4.93 4.24 4.24'/><path d='m14.83 9.17 4.24-4.24'/><path d='m14.83 14.83 4.24 4.24'/><path d='m9.17 14.83-4.24 4.24'/><circle cx='12' cy='12' r='4'/></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel for in-browser standalone execution (Zero-build) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen custom-scrollbar flex flex-col">

  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Main Application Component
    function App() {
      const [dataset, setDataset] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);
      const [activeTab, setActiveTab] = useState('overview'); // 'overview' | 'gallery' | 'train' | 'security'
      const [selectedPart, setSelectedPart] = useState('ALL');
      const [selectedStatus, setSelectedStatus] = useState('ALL'); // 'ALL' | 'OK' | 'NOK'
      const [inspectedImage, setInspectedImage] = useState(null);
      const [isDragging, setIsDragging] = useState(false);

      // Training parameters
      const [epochs, setEpochs] = useState(35);
      const [batchSize, setBatchSize] = useState(8);
      const [imgsz, setImgsz] = useState(640);
      const [modelName, setModelName] = useState('trained_model.onnx');
      const [githubRepo, setGithubRepo] = useState('');
      const [githubToken, setGithubToken] = useState('');
      const [dispatchStatus, setDispatchStatus] = useState(null);

      // Dataset JSON File Processing
      const processJsonFile = (file) => {
        setIsLoading(true);
        setErrorMsg(null);

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const content = e.target.result;
            const parsed = JSON.parse(content);
            const images = parsed.images || (Array.isArray(parsed) ? parsed : null);

            if (!images || !Array.isArray(images) || images.length === 0) {
              throw new Error('The file does not contain a valid list of annotated images.');
            }

            // Normalize images and annotations
            let totalAnnotations = 0;
            let okCount = 0;
            let nokCount = 0;
            const classesMap = new Map();

            images.forEach((img, i) => {
              img.annotations = img.annotations || [];
              img.annotations.forEach(ann => {
                totalAnnotations++;
                const status = (ann.status || '').toUpperCase();
                if (status === 'OK') okCount++;
                if (status === 'NOK') nokCount++;

                const baseLabel = (ann.label || ann.nomePeca || 'OBJECT').trim();
                const fullLabel = status && !baseLabel.toUpperCase().endsWith(`_${status}`) 
                  ? `${baseLabel}_${status}` 
                  : baseLabel;

                classesMap.set(fullLabel, (classesMap.get(fullLabel) || 0) + 1);
              });
            });

            const processedDataset = {
              filename: file.name,
              exportDate: parsed.exportDate || new Date().toISOString(),
              totalImages: images.length,
              totalAnnotations,
              okCount,
              nokCount,
              classes: Array.from(classesMap.entries()).map(([name, count]) => ({ name, count })),
              images: images
            };

            setDataset(processedDataset);
            setActiveTab('overview');
          } catch (err) {
            console.error('Failed to process dataset:', err);
            setErrorMsg(err.message || 'Invalid JSON file.');
          } finally {
            setIsLoading(false);
          }
        };
        reader.readAsText(file);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const file = e.dataTransfer.files?.[0];
        if (file && file.name.endsWith('.json')) {
          processJsonFile(file);
        } else {
          setErrorMsg('Please drop a valid .json file containing image annotations.');
        }
      };

      const handleFileSelect = (e) => {
        const file = e.target.files?.[0];
        if (file) processJsonFile(file);
      };

      // Filter images for gallery view
      const filteredImages = useMemo(() => {
        if (!dataset) return [];
        return dataset.images.filter(img => {
          // Filter by class / label
          if (selectedPart !== 'ALL') {
            const hasClass = img.annotations.some(ann => {
              const baseLabel = (ann.label || ann.nomePeca || '').trim();
              const fullLabel = ann.status ? `${baseLabel}_${ann.status}` : baseLabel;
              return fullLabel === selectedPart || baseLabel === selectedPart;
            });
            if (!hasClass) return false;
          }
          // Filter by status (OK / NOK)
          if (selectedStatus !== 'ALL') {
            const hasStatus = img.annotations.some(ann => (ann.status || '').toUpperCase() === selectedStatus);
            if (!hasStatus) return false;
          }
          return true;
        });
      }, [dataset, selectedPart, selectedStatus]);

      // Direct GitHub Actions dispatch (optional)
      const handleDispatchGithub = async () => {
        if (!githubRepo.trim()) {
          alert('Please enter your repository in the format: username/repository-name');
          return;
        }
        if (!githubToken.trim()) {
          alert('To dispatch directly from this page, enter a GitHub Personal Access Token (PAT). Alternatively, trigger manually from the Actions tab in your repository.');
          return;
        }

        setDispatchStatus({ loading: true, message: 'Dispatching training command to GitHub Actions...' });

        try {
          const endpoint = `https://api.github.com/repos/${githubRepo.trim()}/actions/workflows/train.yml/dispatches`;
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Accept': 'application/vnd.github.v3+json',
              'Authorization': `Bearer ${githubToken.trim()}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              ref: 'main',
              inputs: {
                epochs: String(epochs),
                batch_size: String(batchSize),
                imgsz: String(imgsz),
                model_name: modelName.trim() || 'trained_model.onnx',
              }
            })
          });

          if (res.ok || res.status === 204) {
            setDispatchStatus({
              success: true,
              message: '🚀 Training workflow triggered successfully! Monitor progress in your repository Actions tab.'
            });
          } else {
            const errJson = await res.json().catch(() => ({}));
            throw new Error(errJson.message || `HTTP Error ${res.status}`);
          }
        } catch (err) {
          setDispatchStatus({
            error: true,
            message: `Failed to dispatch workflow: ${err.message}`
          });
        }
      };

      return (
        <div className="flex-1 flex flex-col">
          {/* Top Header */}
          <header className="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                  <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="10" />
                    <path d="m4.93 4.93 4.24 4.24" />
                    <path d="m14.83 9.17 4.24-4.24" />
                    <path d="m14.83 14.83 4.24 4.24" />
                    <path d="m9.17 14.83-4.24 4.24" />
                    <circle cx="12" cy="12" r="4" />
                  </svg>
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="font-bold text-base tracking-tight text-white">YOLO ONNX Cloud Trainer</h1>
                    <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold">
                      GNU AGPLv3 (YOLO Compliant)
                    </span>
                    <span className="hidden sm:inline text-[10px] uppercase font-mono px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-semibold">
                      Zero-Retention
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">Industrial WebAssembly Trainer • 0% Local Python</p>
                </div>
              </div>

              {/* Guarantees & Links */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setActiveTab('security')}
                  className="hidden md:flex items-center space-x-1.5 px-3 py-1.5 text-xs text-slate-300 hover:text-white bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 rounded-lg transition"
                >
                  <svg className="w-3.5 h-3.5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                  <span>Privacy Guarantee</span>
                </button>

                <a
                  href="./train_colab.ipynb"
                  download
                  className="flex items-center space-x-1.5 px-3 py-1.5 text-xs font-medium text-amber-300 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 rounded-lg transition"
                  title="Download Colab Notebook for free GPU T4 training"
                >
                  <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                  <span>Colab Notebook</span>
                </a>
              </div>
            </div>
          </header>

          {/* Zero-Retention Alert Banner */}
          <div className="bg-indigo-950/40 border-b border-indigo-900/40 px-4 py-2 text-xs text-indigo-300">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span><strong>Industrial Privacy Guaranteed:</strong> All image parsing on this page executes 100% in your browser's local RAM. No photos are stored on or sent to persistent servers.</span>
              </div>
              <button onClick={() => setActiveTab('security')} className="underline hover:text-indigo-200 shrink-0 ml-4">
                How it works?
              </button>
            </div>
          </div>

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">

            {/* SECTION 1: DROPZONE / DATASET SELECTION (When no dataset is loaded) */}
            {!dataset && (
              <div className="max-w-3xl mx-auto my-8">
                <div
                  onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                  onDragLeave={() => setIsDragging(false)}
                  onDrop={handleDrop}
                  className={`border-2 border-dashed rounded-3xl p-10 text-center transition-all ${
                    isDragging 
                      ? 'border-indigo-400 bg-indigo-950/30 scale-[1.01]' 
                      : 'border-slate-700/80 bg-slate-900/40 hover:border-slate-600'
                  }`}
                >
                  <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-indigo-600/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
                    <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                  </div>

                  <h2 className="text-xl font-semibold text-white mb-2">Import Exported Dataset</h2>
                  <p className="text-sm text-slate-400 max-w-md mx-auto mb-6">
                    Drag and drop your <code className="text-indigo-400 font-mono bg-slate-800 px-1.5 py-0.5 rounded">dataset.json</code> file to inspect annotations and configure cloud training.
                  </p>

                  <div className="flex flex-col sm:flex-row items-center justify-center gap-3">
                    <label className="cursor-pointer px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition shadow-lg shadow-indigo-600/20 active:scale-95">
                      <span>Select JSON File</span>
                      <input type="file" accept=".json" onChange={handleFileSelect} className="hidden" />
                    </label>
                  </div>

                  {errorMsg && (
                    <div className="mt-6 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs text-left max-w-md mx-auto flex items-center space-x-2">
                      <svg className="w-4 h-4 text-rose-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                      <span>{errorMsg}</span>
                    </div>
                  )}

                  <div className="mt-8 pt-6 border-t border-slate-800/80 grid grid-cols-1 sm:grid-cols-3 gap-4 text-left">
                    <div className="flex items-start space-x-2.5">
                      <div className="w-5 h-5 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center shrink-0 mt-0.5 text-xs font-bold">✓</div>
                      <div>
                        <h4 className="text-xs font-semibold text-slate-200">100% In-Browser</h4>
                        <p className="text-[11px] text-slate-400">Images parsed strictly inside local volatile RAM.</p>
                      </div>
                    </div>
                    <div className="flex items-start space-x-2.5">
                      <div className="w-5 h-5 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center shrink-0 mt-0.5 text-xs font-bold">✓</div>
                      <div>
                        <h4 className="text-xs font-semibold text-slate-200">Zero Local Python</h4>
                        <p className="text-[11px] text-slate-400">Fully compatible with restricted corporate workstations.</p>
                      </div>
                    </div>
                    <div className="flex items-start space-x-2.5">
                      <div className="w-5 h-5 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center shrink-0 mt-0.5 text-xs font-bold">✓</div>
                      <div>
                        <h4 className="text-xs font-semibold text-slate-200">Direct .ONNX Export</h4>
                        <p className="text-[11px] text-slate-400">Ready for instant inference in browser, Edge, or WebAssembly apps.</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* SECTION 2: LOADED DATASET & DASHBOARD */}
            {dataset && (
              <div>
                {/* Navigation Tabs Bar */}
                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-6">
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => setActiveTab('overview')}
                      className={`px-4 py-2 rounded-xl text-xs font-medium transition ${
                        activeTab === 'overview'
                          ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
                          : 'text-slate-400 hover:text-white hover:bg-slate-800'
                      }`}
                    >
                      📊 Overview & Metrics
                    </button>
                    <button
                      onClick={() => setActiveTab('gallery')}
                      className={`px-4 py-2 rounded-xl text-xs font-medium transition ${
                        activeTab === 'gallery'
                          ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
                          : 'text-slate-400 hover:text-white hover:bg-slate-800'
                      }`}
                    >
                      🖼️ Image Gallery ({dataset.totalImages})
                    </button>
                    <button
                      onClick={() => setActiveTab('train')}
                      className={`px-4 py-2 rounded-xl text-xs font-medium transition ${
                        activeTab === 'train'
                          ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
                          : 'text-slate-400 hover:text-white hover:bg-slate-800'
                      }`}
                    >
                      🚀 Cloud Training
                    </button>
                    <button
                      onClick={() => setActiveTab('security')}
                      className={`px-4 py-2 rounded-xl text-xs font-medium transition ${
                        activeTab === 'security'
                          ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
                          : 'text-slate-400 hover:text-white hover:bg-slate-800'
                      }`}
                    >
                      🔒 Security & Zero Retention
                    </button>
                  </div>

                  <div className="flex items-center space-x-2">
                    <label className="cursor-pointer text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                      <span>Switch File</span>
                      <input type="file" accept=".json" onChange={handleFileSelect} className="hidden" />
                    </label>
                  </div>
                </div>

                {/* TAB 1: OVERVIEW & METRICS */}
                {activeTab === 'overview' && (
                  <div className="space-y-6">
                    {/* Metrics Cards */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                      <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
                        <div className="text-xs text-slate-400 mb-1">Total Images</div>
                        <div className="text-2xl font-bold text-white tracking-tight">{dataset.totalImages}</div>
                        <div className="text-[11px] text-slate-500 mt-1 font-mono">{dataset.filename}</div>
                      </div>

                      <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
                        <div className="text-xs text-slate-400 mb-1">Total Annotations (Boxes)</div>
                        <div className="text-2xl font-bold text-indigo-400 tracking-tight">{dataset.totalAnnotations}</div>
                        <div className="text-[11px] text-slate-500 mt-1">Avg {(dataset.totalAnnotations / (dataset.totalImages || 1)).toFixed(1)} boxes/image</div>
                      </div>

                      <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
                        <div className="text-xs text-slate-400 mb-1">Conforming Samples (OK)</div>
                        <div className="text-2xl font-bold text-emerald-400 tracking-tight">{dataset.okCount}</div>
                        <div className="text-[11px] text-emerald-500/80 mt-1">Factory baseline standard</div>
                      </div>

                      <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
                        <div className="text-xs text-slate-400 mb-1">Deviation Samples (NOK)</div>
                        <div className="text-2xl font-bold text-rose-400 tracking-tight">{dataset.nokCount}</div>
                        <div className="text-[11px] text-rose-500/80 mt-1">Defects or missing parts</div>
                      </div>
                    </div>

                    {/* Identified Classes */}
                    <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-5">
                      <h3 className="text-sm font-semibold text-white mb-3 flex items-center space-x-2">
                        <span>🏷️ Classes Mapped for YOLO</span>
                        <span className="text-xs font-mono bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">{dataset.classes.length} classes</span>
                      </h3>

                      <div className="flex flex-wrap gap-2">
                        {dataset.classes.map((cls, idx) => (
                          <div
                            key={idx}
                            className={`flex items-center space-x-2 px-3 py-1.5 rounded-xl border text-xs font-mono ${
                              cls.name.endsWith('_NOK')
                                ? 'bg-rose-500/10 border-rose-500/30 text-rose-300'
                                : cls.name.endsWith('_OK')
                                ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300'
                                : 'bg-indigo-500/10 border-indigo-500/30 text-indigo-300'
                            }`}
                          >
                            <span className="font-bold">[{idx}]</span>
                            <span>{cls.name}</span>
                            <span className="text-[10px] bg-slate-800/80 px-1.5 py-0.2 rounded font-sans text-slate-300">{cls.count}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Call to Action Banner */}
                    <div className="bg-gradient-to-r from-indigo-950/60 via-slate-900 to-slate-900 border border-indigo-500/30 rounded-2xl p-6 flex flex-col md:flex-row items-center justify-between gap-4">
                      <div>
                        <h3 className="text-base font-semibold text-white">Dataset Ready for Training!</h3>
                        <p className="text-xs text-slate-300 mt-1 max-w-xl">
                          All images and labels have been validated in browser memory. You can now train the YOLO model in the cloud using GitHub Actions or Google Colab on GPU.
                        </p>
                      </div>
                      <button
                        onClick={() => setActiveTab('train')}
                        className="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition shadow-lg shadow-indigo-600/30 shrink-0 flex items-center space-x-2 active:scale-95"
                      >
                        <span>🚀 Configure Cloud Trainer</span>
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                      </button>
                    </div>
                  </div>
                )}

                {/* TAB 2: PHOTO GALLERY WITH BOUNDING BOX OVERLAY */}
                {activeTab === 'gallery' && (
                  <div className="space-y-4">
                    {/* Filters Toolbar */}
                    <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900/60 border border-slate-800 p-3 rounded-xl">
                      <div className="flex items-center space-x-2 text-xs">
                        <span className="text-slate-400 font-medium">Filter Class:</span>
                        <select
                          value={selectedPart}
                          onChange={(e) => setSelectedPart(e.target.value)}
                          className="bg-slate-800 border border-slate-700 text-white rounded-lg px-2.5 py-1 text-xs focus:ring-1 focus:ring-indigo-500"
                        >
                          <option value="ALL">All Classes ({dataset.classes.length})</option>
                          {dataset.classes.map(c => (
                            <option key={c.name} value={c.name}>{c.name} ({c.count})</option>
                          ))}
                        </select>
                      </div>

                      <div className="flex items-center space-x-2 text-xs">
                        <span className="text-slate-400 font-medium">Status:</span>
                        <div className="flex rounded-lg bg-slate-800 p-0.5 border border-slate-700">
                          {['ALL', 'OK', 'NOK'].map(st => (
                            <button
                              key={st}
                              onClick={() => setSelectedStatus(st)}
                              className={`px-2.5 py-1 rounded-md text-[11px] font-medium transition ${
                                selectedStatus === st ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'
                              }`}
                            >
                              {st === 'ALL' ? 'All' : st}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="text-xs text-slate-400 font-mono">
                        Showing <strong>{filteredImages.length}</strong> of {dataset.totalImages} images
                      </div>
                    </div>

                    {/* Images Grid */}
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                      {filteredImages.map((img, idx) => (
                        <div
                          key={img.id || idx}
                          onClick={() => setInspectedImage(img)}
                          className="group relative bg-slate-900 border border-slate-800 rounded-xl overflow-hidden cursor-pointer hover:border-indigo-500/50 hover:shadow-lg transition aspect-video flex items-center justify-center"
                        >
                          <img
                            src={img.dataUrl}
                            alt={`Sample ${idx + 1}`}
                            className="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                            loading="lazy"
                          />

                          {/* Index Badge */}
                          <div className="absolute top-1.5 left-1.5 flex items-center space-x-1">
                            <span className="bg-slate-950/80 backdrop-blur text-[10px] font-mono px-1.5 py-0.5 rounded text-slate-300">
                              #{idx + 1}
                            </span>
                          </div>

                          {/* Boxes Count Badge */}
                          <div className="absolute bottom-1.5 right-1.5 flex items-center space-x-1">
                            {img.annotations?.length > 0 && (
                              <span className="bg-indigo-600/90 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow">
                                {img.annotations.length} box{img.annotations.length > 1 ? 'es' : ''}
                              </span>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB 3: CLOUD TRAINING HUB */}
                {activeTab === 'train' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                      {/* Option 1: GitHub Actions */}
                      <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between">
                        <div>
                          <div className="flex items-center space-x-2 text-indigo-400 mb-2">
                            <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                            <h3 className="font-semibold text-white">Option 1: GitHub Actions (Microsoft Cloud)</h3>
                          </div>
                          <p className="text-xs text-slate-400 mb-4">
                            GitHub provisions an isolated Linux container, sets up YOLO, trains the model, and publishes the <code className="text-indigo-300 font-mono">.onnx</code> file in the <strong>Artifacts</strong> section.
                          </p>

                          {/* Parameters Form */}
                          <div className="space-y-3 bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80 mb-4">
                            <div>
                              <div className="flex justify-between text-xs text-slate-300 mb-1">
                                <span>Training Epochs:</span>
                                <span className="font-bold text-indigo-400 font-mono">{epochs} epochs</span>
                              </div>
                              <input
                                type="range"
                                min="15"
                                max="100"
                                step="5"
                                value={epochs}
                                onChange={(e) => setEpochs(Number(e.target.value))}
                                className="w-full accent-indigo-500 cursor-pointer"
                              />
                            </div>

                            <div className="grid grid-cols-2 gap-2 text-xs">
                              <div>
                                <label className="text-slate-400 block mb-1">Batch Size:</label>
                                <select
                                  value={batchSize}
                                  onChange={(e) => setBatchSize(Number(e.target.value))}
                                  className="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-white"
                                >
                                  <option value="4">4 (Smaller datasets)</option>
                                  <option value="8">8 (Recommended)</option>
                                  <option value="16">16 (Large datasets)</option>
                                </select>
                              </div>

                              <div>
                                <label className="text-slate-400 block mb-1">Resolution (imgsz):</label>
                                <select
                                  value={imgsz}
                                  onChange={(e) => setImgsz(Number(e.target.value))}
                                  className="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-white"
                                >
                                  <option value="640">640x640 (Standard YOLO)</option>
                                  <option value="512">512x512 (Faster)</option>
                                </select>
                              </div>
                            </div>

                            <div>
                              <label className="text-slate-400 block text-xs mb-1">Output .onnx File Name:</label>
                              <input
                                type="text"
                                value={modelName}
                                onChange={(e) => setModelName(e.target.value)}
                                className="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-xs font-mono text-white"
                              />
                            </div>
                          </div>

                          {/* Instructions */}
                          <div className="bg-indigo-950/20 border border-indigo-900/30 p-3 rounded-xl text-xs space-y-2 mb-4">
                            <div className="font-semibold text-indigo-300">How to run on GitHub:</div>
                            <ol className="list-decimal list-inside space-y-1 text-slate-300 text-[11px]">
                              <li>In your GitHub repository, open the <strong>Actions</strong> tab.</li>
                              <li>Select <strong>"🚀 YOLO ONNX Cloud Trainer"</strong> from the left sidebar.</li>
                              <li>Click the <strong>"Run workflow"</strong> button to launch training.</li>
                              <li>When finished (~15 min), download your .onnx model under <strong>Artifacts</strong>.</li>
                            </ol>
                          </div>
                        </div>

                        <div className="pt-2">
                          <button
                            onClick={() => {
                              const jsonStr = JSON.stringify(dataset, null, 2);
                              const blob = new Blob([jsonStr], { type: 'application/json' });
                              const url = URL.createObjectURL(blob);
                              const a = document.createElement('a');
                              a.href = url;
                              a.download = 'dataset.json';
                              a.click();
                              URL.revokeObjectURL(url);
                            }}
                            className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-medium text-xs transition border border-slate-700 flex items-center justify-center space-x-2"
                          >
                            <svg className="w-4 h-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                            <span>Download Formatted Dataset (dataset.json)</span>
                          </button>
                        </div>
                      </div>

                      {/* Option 2: Google Colab 1-Click (GPU Tesla T4) */}
                      <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between">
                        <div>
                          <div className="flex items-center space-x-2 text-amber-400 mb-2">
                            <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                            <h3 className="font-semibold text-white">Option 2: Google Colab (Free NVIDIA GPU)</h3>
                            <span className="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-bold">Fastest (~2 min)</span>
                          </div>
                          <p className="text-xs text-slate-400 mb-4">
                            Ideal if you need your model <strong>immediately in 2 minutes</strong>. Google Colab provides a free NVIDIA Tesla T4 GPU with zero local software setup required.
                          </p>

                          <div className="space-y-3 bg-slate-950/60 p-4 rounded-xl border border-slate-800/80 mb-6 text-xs text-slate-300">
                            <h4 className="font-semibold text-white">Colab Step-by-Step:</h4>
                            <div className="flex items-start space-x-2">
                              <span className="w-4 h-4 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0 font-bold text-[10px]">1</span>
                              <span>Open the notebook <code className="text-amber-300 font-mono">train_colab.ipynb</code> in Google Colab.</span>
                            </div>
                            <div className="flex items-start space-x-2">
                              <span className="w-4 h-4 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0 font-bold text-[10px]">2</span>
                              <span>Click <strong>Runtime &gt; Run all</strong> to start execution.</span>
                            </div>
                            <div className="flex items-start space-x-2">
                              <span className="w-4 h-4 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0 font-bold text-[10px]">3</span>
                              <span>Select your dataset JSON file when prompted by the upload widget.</span>
                            </div>
                            <div className="flex items-start space-x-2">
                              <span className="w-4 h-4 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0 font-bold text-[10px]">4</span>
                              <span>Colab trains on the GPU and <strong>automatically triggers the .onnx download</strong>!</span>
                            </div>
                          </div>
                        </div>

                        <div className="space-y-2">
                          <a
                            href="https://colab.research.google.com/"
                            target="_blank"
                            rel="noreferrer"
                            className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold text-xs transition shadow-lg shadow-amber-500/20 flex items-center justify-center space-x-2"
                          >
                            <span>Open Google Colab</span>
                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                          </a>
                        </div>
                      </div>

                    </div>
                  </div>
                )}

                {/* TAB 4: SECURITY DECLARATION & ZERO RETENTION */}
                {activeTab === 'security' && (
                  <div className="max-w-4xl mx-auto bg-slate-900/60 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-6">
                    <div className="border-b border-slate-800 pb-4">
                      <div className="inline-flex items-center space-x-2 text-emerald-400 text-xs font-semibold uppercase tracking-wider mb-2">
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                        <span>Compliance & Data Privacy Guarantee</span>
                      </div>
                      <h2 className="text-xl font-bold text-white">Zero-Data Retention Declaration</h2>
                      <p className="text-xs text-slate-400 mt-1">
                        Technical architecture documentation for review by corporate IT, SecOps, and Data Privacy audit teams.
                      </p>
                    </div>

                    <div className="space-y-4 text-xs text-slate-300 leading-relaxed">
                      <div className="bg-slate-950/60 p-4 rounded-xl border border-slate-800">
                        <h4 className="font-semibold text-white mb-1">1. 100% Client-Side Execution in This Web Application:</h4>
                        <p className="text-slate-400">
                          This application is a static website hosted on GitHub Pages. There is no proprietary backend server, no SQL or NoSQL database, and zero telemetry of user images. When a <code className="text-indigo-300">.json</code> dataset is loaded, it is processed strictly by the browser's JavaScript engine inside local volatile memory (RAM) via the HTML5 <code className="text-indigo-300">FileReader</code> API.
                        </p>
                      </div>

                      <div className="bg-slate-950/60 p-4 rounded-xl border border-slate-800">
                        <h4 className="font-semibold text-white mb-1">2. Ephemeral Cloud Containers (GitHub Actions / Google Colab):</h4>
                        <p className="text-slate-400">
                          Cloud training runs inside single-use, isolated virtual machine containers provisioned on demand by Microsoft/GitHub or Google Cloud. The <code className="text-indigo-300">train_cloud.py</code> script decodes images directly into a temporary filesystem partition (<code className="text-slate-300">/tmp</code>), trains the YOLO neural network, compiles the mathematical binary <code className="text-indigo-300">.onnx</code> model, and immediately triggers an automated purge (<code className="text-slate-300">shutil.rmtree</code>) of all decoded images before runner termination.
                        </p>
                      </div>

                      <div className="bg-slate-950/60 p-4 rounded-xl border border-slate-800">
                        <h4 className="font-semibold text-white mb-1">3. Zero Images Stored in Git History:</h4>
                        <p className="text-slate-400">
                          No photos or proprietary manufactured parts are ever committed to repository version control. The repository source code remains public and fully auditable under the GNU AGPL-3.0 license, while confidential image datasets remain strictly within volatile memory during training.
                        </p>
                      </div>

                      <div className="bg-slate-950/60 p-4 rounded-xl border border-slate-800">
                        <h4 className="font-semibold text-white mb-1">4. Open Standard Output Format (.ONNX):</h4>
                        <p className="text-slate-400">
                          The sole product generated is the compiled mathematical neural model file (<code className="text-emerald-400 font-mono">.onnx</code>), consisting purely of numerical floating-point tensor matrices without any readable visual image data.
                        </p>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* IMAGE INSPECTION MODAL */}
            {inspectedImage && (
              <div
                onClick={() => setInspectedImage(null)}
                className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur flex items-center justify-center p-4"
              >
                <div
                  onClick={(e) => e.stopPropagation()}
                  className="bg-slate-900 border border-slate-800 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col shadow-2xl"
                >
                  <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                    <div>
                      <h3 className="text-sm font-semibold text-white">Sample Detail Inspection</h3>
                      <p className="text-xs text-slate-400 font-mono">
                        {inspectedImage.annotations?.length || 0} annotation(s) detected
                      </p>
                    </div>
                    <button
                      onClick={() => setInspectedImage(null)}
                      className="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition"
                    >
                      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                  </div>

                  <div className="p-4 flex-1 overflow-auto flex flex-col items-center justify-center bg-slate-950">
                    <div className="relative max-w-full max-h-[60vh] inline-block">
                      <img
                        src={inspectedImage.dataUrl}
                        alt="Inspected sample"
                        className="max-w-full max-h-[60vh] object-contain rounded-lg"
                      />

                      {/* SVG Overlay with Normalized Bounding Boxes */}
                      <svg className="absolute inset-0 w-full h-full pointer-events-none">
                        {inspectedImage.annotations?.map((ann, aIdx) => {
                          const bbox = ann.bbox_percent || ann.bbox || {};
                          let x = bbox.x || 0;
                          let y = bbox.y || 0;
                          let w = bbox.width || 0;
                          let h = bbox.height || 0;

                          // Normalize if values are 0..1
                          if (x <= 1 && y <= 1 && w <= 1 && h <= 1) {
                            x *= 100;
                            y *= 100;
                            w *= 100;
                            h *= 100;
                          }

                          const isOk = (ann.status || '').toUpperCase() === 'OK';
                          const strokeColor = isOk ? '#10b981' : '#f43f5e';

                          return (
                            <g key={aIdx}>
                              <rect
                                x={`${x}%`}
                                y={`${y}%`}
                                width={`${w}%`}
                                height={`${h}%`}
                                fill={isOk ? 'rgba(16, 185, 129, 0.15)' : 'rgba(244, 63, 94, 0.15)'}
                                stroke={strokeColor}
                                strokeWidth="2"
                                strokeDasharray="3 3"
                              />
                            </g>
                          );
                        })}
                      </svg>
                    </div>

                    {/* Annotation Labels Chips */}
                    <div className="mt-4 w-full flex flex-wrap gap-2 justify-center">
                      {inspectedImage.annotations?.map((ann, aIdx) => (
                        <div
                          key={aIdx}
                          className={`text-xs px-2.5 py-1 rounded-lg border flex items-center space-x-1.5 font-mono ${
                            ann.status === 'OK'
                              ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300'
                              : 'bg-rose-500/10 border-rose-500/30 text-rose-300'
                          }`}
                        >
                          <span className="font-bold">{ann.label || ann.nomePeca || 'OBJECT'}</span>
                          <span>•</span>
                          <span className="font-semibold">{ann.status || 'OK'}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Bottom Footer */}
          <footer className="border-t border-slate-800 bg-slate-900/40 py-4 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <div>
                <strong>YOLO ONNX Cloud Trainer</strong> • Distributed under <a href="./LICENSE" className="text-slate-400 hover:text-white underline">GNU AGPL-3.0 License</a> (fully compliant with Ultralytics).
              </div>
              <div className="text-[11px] text-slate-500">
                100% Compatible with computer vision annotation studios and WebAssembly (ONNX Runtime Web)
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Mount Application into DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
