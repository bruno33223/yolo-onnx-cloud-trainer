name: "🚀 YOLO ONNX Cloud Trainer (Zero-Retention)"

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of Training Epochs"
        required: true
        default: "30"
        type: string
      batch_size:
        description: "Batch Size"
        required: true
        default: "8"
        type: string
      imgsz:
        description: "Image Resolution (imgsz)"
        required: true
        default: "640"
        type: string
      model_name:
        description: "Output .onnx File Name"
        required: true
        default: "trained_model.onnx"
        type: string
      dataset_file:
        description: "Dataset JSON File Name (optional, searches for latest)"
        required: false
        default: ""
        type: string

  # Automatically trigger when a dataset is pushed or updated in the repository
  push:
    paths:
      - "*dataset*.json"
      - "dataset.json"

permissions:
  contents: write

jobs:
  train-yolo-onnx:
    name: "Train YOLOv8/26 & Export ONNX"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "📥 1. Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 2. Set Up Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: "📦 3. Install Computer Vision Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics onnx onnxslim

      - name: "🏋️ 4. Execute Training and Export to ONNX"
        run: |
          DATASET_ARG=""
          if [ -n "${{ inputs.dataset_file }}" ]; then
            DATASET_ARG="-d ${{ inputs.dataset_file }}"
          fi
          
          python scripts/train_cloud.py \
            $DATASET_ARG \
            -e ${{ inputs.epochs || '30' }} \
            -b ${{ inputs.batch_size || '8' }} \
            -s ${{ inputs.imgsz || '640' }} \
            -m "${{ inputs.model_name || 'trained_model.onnx' }}" \
            -o "output"

      - name: "🧹 5. Purge Images and Temporary Files (Zero-Retention)"
        run: |
          echo "[*] Purging image artifacts and temporary caches..."
          rm -rf /tmp/yolo_cloud_trainer_* || true
          rm -f *dataset*.json dataset.json || true
          echo "[✓] Environment sanitized. Zero photos retained."

      - name: "📤 6. Publish ONNX Model for Download (Artifacts)"
        uses: actions/upload-artifact@v4
        with:
          name: "trained-onnx-model"
          path: |
            output/*.onnx
            output/metadata.json
          retention-days: 7
          if-no-files-found: error

      - name: "🏷️ 7. Create GitHub Release with ONNX Model (Optional)"
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "model-${{ github.run_number }}"
          name: "Trained Model (Run #${{ github.run_number }})"
          body: |
            ### 🚀 YOLO Model Successfully Trained!
            - **Model File:** `${{ inputs.model_name || 'trained_model.onnx' }}`
            - **Epochs:** `${{ inputs.epochs || '30' }}`
            - **Batch Size:** `${{ inputs.batch_size || '8' }}`
            - **Privacy:** 100% Zero-Data Retention (no images were persisted in the cloud).
          files: |
            output/*.onnx
            output/metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
